name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与单测
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Android SDK
        # GitHub runner 自带 Android SDK 与 cmdline-tools，不用 setup-android action
        # （那个 action 在 CI 上会自己失败，且已不再维护）。
        # 这里只做两件事：把 cmdline-tools 放到 PATH 上，然后接受许可。
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/bin" >> "$GITHUB_PATH"

      - name: 接受 SDK 许可
        # 必须先接受许可再装包：sdkmanager 在许可未接受时会拒绝安装。
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: 安装 SDK 组件
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: 校验 SDK 组件
        # 直接查目录，不依赖 sdkmanager 的输出格式。
        # 缺包时明确报出缺哪个，比让 Gradle 抛一堆 "failed to find target" 清楚。
        run: |
          ok=1
          [ -d "$ANDROID_HOME/platforms/android-36" ]    || { echo "::error::缺少 platforms;android-36"; ok=0; }
          [ -d "$ANDROID_HOME/build-tools/36.1.0" ]      || { echo "::error::缺少 build-tools;36.1.0"; ok=0; }
          ls "$ANDROID_HOME/platforms"  2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          [ "$ok" = 1 ]

      - name: 单元测试
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: 构建 Debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: pinkvoice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          retention-days: 7
