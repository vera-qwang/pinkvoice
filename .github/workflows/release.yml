name: Release

# 只在**打标签**时构建发布：
#
#     git tag v1.2.3 && git push origin v1.2.3
#
# 普通提交不触发——每次提交都构建一遍 Release 纯属浪费 Actions 额度，
# 而且会把正式版本的列表冲得很乱。
#
# 也可以手动触发（Actions → Release → Run workflow），用于补发某个标签。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，例如 v0.2.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: 构建并发布 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/bin" >> "$GITHUB_PATH"

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 安装 SDK 组件
        run: sdkmanager --install "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: 准备签名密钥
        # 配了 secrets 就用正式签名；没配就退回仓库里的 debug keystore，
        # 保证 workflow 不会因为"没配密钥"失败，用户总能下到能装的 APK。
        run: |
          if [ -n "${{ secrets.PINKVOICE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.PINKVOICE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            {
              echo "PINKVOICE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore"
              echo "PINKVOICE_KEYSTORE_PASSWORD=${{ secrets.PINKVOICE_STORE_PASSWORD }}"
              echo "PINKVOICE_KEY_ALIAS=${{ secrets.PINKVOICE_KEY_ALIAS }}"
              echo "PINKVOICE_KEY_PASSWORD=${{ secrets.PINKVOICE_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "::notice::使用正式签名密钥"
          else
            echo "::notice::未配置签名 secrets，改用仓库内的 debug keystore 签名"
          fi

      - name: 校验签名密钥
        # 在跑 gradle 之前先验一遍。口令错了的话，gradle 会一路跑到
        # packageRelease 才炸（KeytoolException: keystore password was incorrect），
        # 前面十几步全白跑，日志还很难找。这里提前挡住，报错也直白。
        run: |
          if [ -z "$PINKVOICE_KEYSTORE_PATH" ]; then
            echo "::warning::没配置签名 Secret，用仓库内的 debug keystore 签名"
            exit 0
          fi
          if [ ! -f "$PINKVOICE_KEYSTORE_PATH" ]; then
            echo "::error::keystore 文件不存在：$PINKVOICE_KEYSTORE_PATH"
            exit 1
          fi
          echo "keystore 大小: $(stat -c %s "$PINKVOICE_KEYSTORE_PATH") 字节"
          if ! keytool -list -keystore "$PINKVOICE_KEYSTORE_PATH" \
               -storepass "$PINKVOICE_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::密钥库口令不对——重跑 scripts/setup-release-secrets.sh"
            exit 1
          fi
          echo "::notice::密钥库口令正确"

      - name: 确定版本号
        id: ver
        run: |
          set -euo pipefail
          # 手动触发时用输入的标签，推标签时用标签本身
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"

          # versionCode 统一用构建时间（YYMMDDHH）。
          #
          # 之前试过"按版本号推导"（1.2.3 → 10203），但那样 latest 滚动版
          # 和标签版会用两套编码，大小关系不可控——Android 会以
          # INSTALL_FAILED_VERSION_DOWNGRADE 拒绝安装。
          # 时间戳编码天生单调递增，两种发布方式混用也不会打架。
          CODE="$(date +%y%m%d%H)"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: 构建 Release APK
        run: |
          # 关掉配置缓存：签名配置依赖环境变量，配置缓存会让
          # "这次用的是哪个 keystore" 被上一次的结果固化住。
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            :app:assembleRelease \
            -PversionName="${{ steps.ver.outputs.version }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: 收集 APK
        id: apk
        run: |
          mkdir -p dist
          NAME="pinkvoice-${{ steps.ver.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          APK: dist/${{ steps.apk.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 先把可能存在的旧版本清干净。
          #
          # 之前用"已存在就 upload --clobber"的写法出过岔子：
          # 一旦留下一个**草稿**（草稿对匿名用户完全不可见），后面每次
          # 跑都只是往草稿上补附件，表面上步骤全绿，
          # 实际上 Releases 页面（和公开 API）里什么都没有。
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "==> 删除已存在的 $TAG"
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true
          fi

          echo "==> 创建 Release $TAG"
          gh release create "$TAG" "$APK" \
            --repo "$REPO" \
            --title "PinkVoice $VERSION" \
            --generate-notes

          # 自检：确认发布出来的东西是"别人能看见且能下载"的状态。
          DRAFT=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)
          COUNT=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets | length')
          echo "==> isDraft=$DRAFT 附件数=$COUNT"
          if [ "$DRAFT" = "true" ]; then
            echo "::error::Release 处于草稿状态，匿名用户看不到"
            exit 1
          fi
          if [ "$COUNT" = "0" ]; then
            echo "::error::Release 没有附件"
            exit 1
          fi
          echo "::notice::Release 发布成功：$TAG（附件 $COUNT 个）"

      - name: 上传 APK 到 Actions
        uses: actions/upload-artifact@v4
        with:
          name: pinkvoice-${{ steps.ver.outputs.version }}
          path: dist/*.apk
          retention-days: 30
