name: Release

# 两种发布方式：
#
# 1. 推标签（v1.2.3）→ 发布正式 Release
#      git tag v1.2.3 && git push origin v1.2.3
#
# 2. 推 main 分支 → 更新滚动的 "latest" 预发布
#      用户永远能从 Releases 页面下到最新构建，不用等发版。
#
# 也可以手动触发（Actions → Release → Run workflow）。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签，例如 v0.2.0（留空则只更新 latest）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: 构建并发布 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/bin" >> "$GITHUB_PATH"

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 安装 SDK 组件
        run: sdkmanager --install "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: 准备签名密钥
        # 配了 secrets 就用正式签名；没配就退回仓库里的 debug keystore，
        # 保证 workflow 不会因为"没配密钥"失败，用户总能下到能装的 APK。
        run: |
          if [ -n "${{ secrets.PINKVOICE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.PINKVOICE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            {
              echo "PINKVOICE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore"
              echo "PINKVOICE_KEYSTORE_PASSWORD=${{ secrets.PINKVOICE_STORE_PASSWORD }}"
              echo "PINKVOICE_KEY_ALIAS=${{ secrets.PINKVOICE_KEY_ALIAS }}"
              echo "PINKVOICE_KEY_PASSWORD=${{ secrets.PINKVOICE_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "::notice::使用正式签名密钥"
          else
            echo "::notice::未配置签名 secrets，改用仓库内的 debug keystore 签名"
          fi

      - name: 确定版本号
        id: ver
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          fi

          if [ "$TAG" = "latest" ]; then
            # 滚动预发布：版本号带短 SHA，一眼能看出是哪个提交
            VERSION="0.1.0+${GITHUB_SHA::7}"
          else
            VERSION="${TAG#v}"
          fi

          # versionCode 统一用构建时间（YYMMDDHH）。
          #
          # 之前试过"按版本号推导"（1.2.3 → 10203），但那样 latest 滚动版
          # 和标签版会用两套编码，大小关系不可控——Android 会以
          # INSTALL_FAILED_VERSION_DOWNGRADE 拒绝安装。
          # 时间戳编码天生单调递增，两种发布方式混用也不会打架。
          CODE="$(date +%y%m%d%H)"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: 构建 Release APK
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleRelease \
            -PversionName="${{ steps.ver.outputs.version }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: 收集 APK
        id: apk
        run: |
          mkdir -p dist
          NAME="pinkvoice-${{ steps.ver.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          APK: dist/${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          if [ "$TAG" = "latest" ]; then
            # 滚动预发布：始终只有一个 latest，APK 每次替换
            if gh release view latest >/dev/null 2>&1; then
              gh release upload latest "$APK" --clobber
              gh release edit latest --target "$GITHUB_SHA" --title "PinkVoice (latest)" || true
            else
              gh release create latest "$APK" \
                --target "$GITHUB_SHA" \
                --title "PinkVoice (latest)" \
                --prerelease \
                --notes "自动构建的最新版本，来自 \`main\` 分支。正式版本请看带版本号的 Release。"
            fi
          else
            gh release create "$TAG" "$APK" \
              --title "PinkVoice $VERSION" \
              --generate-notes
          fi

      - name: 上传 APK 到 Actions
        uses: actions/upload-artifact@v4
        with:
          name: pinkvoice-${{ steps.ver.outputs.version }}
          path: dist/*.apk
          retention-days: 30
